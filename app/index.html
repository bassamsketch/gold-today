<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="أسعار الذهب في عُمان مباشرة | Live gold prices in Oman">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ذهب اليوم">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/gold-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/gold-180.png">
<title>ذهب اليوم</title>
<link rel="preload" href="fonts/SourceSerif4-normal-500_600-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/Almarai-normal-400-arabic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<script type="module" src="js/main.js"></script>
</head>
<body>
<svg width="0" height="0" class="defs" aria-hidden="true" focusable="false">
  <defs>
    <!-- the app icon's polished solitaire, drawn small: a metallic band and a faceted stone (scripts/make-icons.py) -->
    <linearGradient id="gold-grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0bf"/><stop offset=".28" stop-color="#e7bd58"/><stop offset=".52" stop-color="#a6741d"/><stop offset=".74" stop-color="#f0cf78"/><stop offset="1" stop-color="#8a5a12"/></linearGradient>
    <symbol id="ring" viewBox="0 0 32 32">
      <circle cx="16" cy="20.4" r="8.3" fill="none" stroke="url(#gold-grad)" stroke-width="2.5"/>
      <path d="M10.6 7.6 14.6 7.6 16 11.6z" fill="#dbe5ee"/><path d="M14.6 7.6 16 7.6 16 11.6z" fill="#f4f8fb"/><path d="M16 7.6 17.4 7.6 16 11.6z" fill="#a9bccf"/><path d="M17.4 7.6 21.4 7.6 16 11.6z" fill="#8fa5bb"/>
      <path d="M10.6 7.6 13.2 5.4 14.6 7.6z" fill="#eef4f9"/><path d="M13.2 5.4 18.8 5.4 17.4 7.6 14.6 7.6z" fill="#fff"/><path d="M18.8 5.4 21.4 7.6 17.4 7.6z" fill="#c5d3e0"/>
      <path d="M10.6 7.6 13.2 5.4 18.8 5.4 21.4 7.6 16 11.6z" fill="none" stroke="#6f8499" stroke-width=".55" stroke-linejoin="round"/>
      <circle cx="10.9" cy="7.4" r=".9" fill="#d9ac48"/><circle cx="21.1" cy="7.4" r=".9" fill="#d9ac48"/>
    </symbol>
  </defs>
</svg>
<div class="app">
  <header class="bar">
    <div class="word"><svg class="mark" aria-hidden="true"><use href="#ring"/></svg><span data-t="appName"></span></div>
    <div class="bar-actions">
      <button class="icon-btn" id="share" type="button" data-aria="share" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"/><path d="M7.5 7.5 12 3l4.5 4.5"/><path d="M5 12v6.5A2.5 2.5 0 0 0 7.5 21h9a2.5 2.5 0 0 0 2.5-2.5V12"/></svg></button>
      <button class="lang-link" type="button" data-lang-toggle data-t="otherLang" lang="en"></button>
    </div>
  </header>

  <main class="views">
    <!-- ================= Today ================= -->
    <section class="view on" data-view="today">
      <h1 class="vh" data-t="todayTitle"></h1>
      <figure class="hero" id="hero">
        <img src="img/hero-600.webp" srcset="img/hero-600.webp 600w, img/hero-1200.webp 1200w" sizes="(max-width: 440px) 100vw, 440px" width="600" height="450" alt="" fetchpriority="high">
        <i class="sheen" aria-hidden="true"></i>
      </figure>
      <div class="price-block">
        <p class="cap" id="price-cap"></p>
        <div class="price">
          <span class="odo" id="price" role="img"></span><span class="unit" id="price-unit" data-t="rial"></span>
          <span class="price-skel" id="price-skel" aria-hidden="true" hidden></span>
          <span class="price-missing" id="price-missing" hidden></span>
        </div>
        <p class="karat-label" id="karat-label" data-t="karat"></p>
        <div class="karats" id="karats" role="radiogroup" aria-labelledby="karat-label"><i class="kline"></i><button type="button" role="radio" data-k="24">24</button><button type="button" role="radio" data-k="22">22</button><button type="button" role="radio" data-k="21">21</button><button type="button" role="radio" data-k="18">18</button></div>
        <p class="status" id="status"><i class="live-dot" aria-hidden="true"></i><span id="status-text"></span><span class="sep" id="status-sep" aria-hidden="true">·</span><span class="vh" id="status-gap">، </span><span id="status-ago"></span></p>
        <p class="change" id="change" hidden></p>
      </div>
      <section class="why" id="why" hidden>
        <h2 class="why-title" id="why-title"></h2>
        <p class="why-text" id="why-text"></p>
        <a class="why-src" id="why-src" target="_blank" rel="noopener"><span data-t="whySource"></span>: <bdi lang="en" id="why-src-name"></bdi></a>
      </section>
      <section class="year" id="year" hidden>
        <p class="year-sent" id="mood"></p>
        <div class="track"><i class="dot" id="year-dot"></i></div>
        <div class="ends"><span data-t="cheapest"></span><span data-t="dearest"></span></div>
        <p class="hint" id="hint"></p>
      </section>
      <section class="board">
        <div class="board-head"><h2 class="sec-title" data-t="boardTitle"></h2><p class="cap" data-t="boardUnit"></p></div>
        <table class="board-table">
          <thead><tr><th scope="col" data-t="karat"></th><th scope="col" data-t="col1g"></th><th scope="col" data-t="col10g"></th><th scope="col" data-t="colTola"></th></tr></thead>
          <tbody id="board-rows"></tbody>
        </table>
        <p class="note" data-t="boardNote"></p>
        <button class="btn-outline" type="button" id="share-today" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"/><path d="M7.5 7.5 12 3l4.5 4.5"/><path d="M5 12v6.5A2.5 2.5 0 0 0 7.5 21h9a2.5 2.5 0 0 0 2.5-2.5V12"/></svg><span data-t="shareToday"></span></button>
      </section>
      <p class="world" id="world"></p>
      <p class="fine disclaimer" data-t="note"></p>
    </section>

    <!-- ================= My gold ================= -->
    <section class="view" data-view="gold">
      <figure class="band"><img src="img/gold-600.webp" srcset="img/gold-600.webp 600w, img/gold-1200.webp 1200w" sizes="(max-width: 440px) 100vw, 440px" width="600" height="338" alt="" loading="lazy"></figure>
      <div class="pad">
        <h1 class="h" data-t="myGold"></h1>
        <div id="gold-total" hidden>
          <p class="cap gold-cap" data-t="ifSold"></p>
          <p class="big"><span class="num" id="gold-mid"></span> <span class="unit" data-t="rial"></span></p>
          <p class="est"><span class="tag" data-t="estimateTag"></span><span id="gold-range"></span></p>
          <p class="gain" id="gold-gain" hidden></p>
          <p class="sub" id="gold-covers" hidden></p>
          <div class="then" id="gold-before" hidden>
            <p class="then-t" data-t="beforeTitle"></p>
            <div class="hrow" id="before-hi"><span><span data-t="yearHigh"></span><small class="when"></small></span><b><span class="num"></span> <small class="u"></small></b></div>
            <div class="hrow" id="before-lo"><span><span data-t="yearLow"></span><small class="when"></small></span><b><span class="num"></span> <small class="u"></small></b></div>
            <div class="hrow" id="before-5"><span class="lbl"></span><b><span class="num"></span> <small class="u"></small></b></div>
            <div class="hrow" id="before-10"><span class="lbl"></span><b><span class="num"></span> <small class="u"></small></b></div>
            <p class="note" data-t="beforeNote"></p>
          </div>
        </div>
        <p class="notice" id="gold-noprice" data-t="noPrice" hidden></p>
        <div class="empty" id="gold-empty" hidden>
          <svg class="empty-mark" aria-hidden="true"><use href="#ring"/></svg>
          <p class="empty-title" data-t="emptyTitle"></p>
          <p class="sub" data-t="emptyBody"></p>
        </div>
        <ul class="pieces" id="pieces" hidden></ul>
        <button class="btn" type="button" id="add-piece" aria-describedby="gold-max"><span aria-hidden="true">+</span><span data-t="addPiece"></span></button>
        <p class="sub max-note" id="gold-max" data-t="maxPieces" hidden></p>
        <div class="keep" id="gold-keep" hidden>
          <p class="note"><span id="storage-note" data-t="storageNote"></span> <button class="link-btn" type="button" id="storage-how" data-t="storageHow"></button></p>
          <button class="btn-quiet wide" type="button" id="share-list"><span data-t="shareList"></span></button>
        </div>
        <p class="note" data-t="payLessNote"></p>
      </div>
    </section>

    <!-- ================= Outlook ================= -->
    <section class="view" data-view="future">
      <div class="pad future-head">
        <h1 class="h" data-t="outlook"></h1>
        <p class="cap" id="outlook-sub"></p>
        <div class="karats small future-karats" id="future-karats" role="radiogroup" data-aria="karat"><i class="kline"></i><button type="button" role="radio" data-fk="24">24</button><button type="button" role="radio" data-fk="22">22</button><button type="button" role="radio" data-fk="21">21</button><button type="button" role="radio" data-fk="18">18</button></div>

        <section class="q" aria-labelledby="q1-title">
          <h2 class="sec-title" id="q1-title" data-t="q1"></h2>
          <p class="answer" id="q1-answer"></p>
          <p class="moves"><span id="move-week"></span><span id="move-month"></span></p>
          <p class="sub" id="q1-mood"></p>
          <div class="chart-wrap" dir="ltr">
            <svg class="fchart" id="fchart" viewBox="0 0 340 214" aria-hidden="true">
              <defs><clipPath id="fchart-clip"><rect class="f-clip" x="0" y="0" width="340" height="214"/></clipPath></defs>
              <g clip-path="url(#fchart-clip)"><path class="f-past"/><circle class="f-rec" r="4.6"/><text class="f-tag f-rec-w" text-anchor="end"></text><text class="f-val f-rec-v" text-anchor="end"></text></g>
              <circle class="f-now" r="5"/>
              <text class="f-tag f-now-w" text-anchor="end"></text><text class="f-val f-now-v" text-anchor="end"></text>
              <text class="f-axis f-l0"></text>
            </svg>
          </div>
          <div class="srow"><span data-t="todayRow"></span><b><span class="num" id="f-today"></span> <small data-t="rialPerGram"></small></b></div>
          <div class="srow rec" id="rec-row"><span><span data-t="recordRow"></span><small id="rec-date"></small></span><b><span class="num" id="f-record"></span> <small data-t="rialPerGram"></small></b></div>
          <p class="caution" id="falls-line"></p>
          <details class="more-info">
            <summary data-t="showDetails"></summary>
            <p class="fold-cap" data-t="fallsCap"></p>
            <table class="falls"><tbody id="falls-rows"></tbody></table>
          </details>
        </section>

        <section class="q" aria-labelledby="q2-title">
          <h2 class="sec-title" id="q2-title" data-t="q2"></h2>
          <p class="answer" data-t="noOneKnows"></p>
          <p class="sub" data-t="q2Sub"></p>
          <div class="odds2" id="odds2"></div>
          <p class="sub" data-t="oddsSince"></p>
          <p class="caution" id="worst-line"><b data-t="worstLead"></b> <span id="worst-text"></span></p>
          <p class="plain-line" id="banks-line"></p>
          <details class="more-info">
            <summary data-t="showDetails"></summary>
            <p class="fold-cap" data-t="periodsCap"></p>
            <div class="odds" id="odds-all"></div>
            <p class="note" data-t="overlapNote"></p>
            <p class="fold-cap" data-t="banksCap"></p>
            <p class="note" id="miss-line"></p>
            <ul class="banks" id="bank-list"></ul>
            <p><button class="link-btn" type="button" id="open-sources" data-t="sources"></button></p>
          </details>
          <p class="note" data-t="inflationNote"></p>
        </section>
        <p class="fine" id="f-updated"></p>
        <p class="fine credit" id="f-data"></p>
      </div>
    </section>

    <!-- ================= Buy & sell ================= -->
    <section class="view" data-view="buysell">
      <figure class="band slim"><img src="img/shop-600.webp" srcset="img/shop-600.webp 600w, img/shop-1200.webp 1200w" sizes="(max-width: 440px) 100vw, 440px" width="600" height="338" alt="" loading="lazy"></figure>
      <div class="pad">
        <h1 class="h" data-t="buySellTitle"></h1>

        <section class="calc" id="pc" aria-labelledby="pc-title">
          <p class="eyebrow" data-t="pcWhen"></p>
          <h2 class="sec-title" id="pc-title" data-t="pcTitle"></h2>
          <p class="intro" data-t="pcIntro"></p>
          <button class="try" type="button" id="pc-example" data-t="showExample"></button>
          <div class="field">
            <label for="pc-grams"><span class="step" aria-hidden="true">1</span><span data-t="weightG"></span></label>
            <input class="input" id="pc-grams" inputmode="decimal" autocomplete="off" enterkeyhint="next" aria-describedby="pc-grams-err">
            <p class="err" id="pc-grams-err" data-t="badWeight" hidden></p>
          </div>
          <div class="field">
            <p class="label" id="pc-k-label"><span class="step" aria-hidden="true">2</span><span data-t="karat"></span></p>
            <div class="karats small" id="pc-karats" role="radiogroup" aria-labelledby="pc-k-label"><i class="kline"></i><button type="button" role="radio" data-ck="24">24</button><button type="button" role="radio" data-ck="22">22</button><button type="button" role="radio" data-ck="21">21</button><button type="button" role="radio" data-ck="18">18</button></div>
            <div class="seg type-seg" id="pc-type" role="radiogroup" data-aria="pieceType" hidden><button type="button" role="radio" data-type="piece" data-t="pieceOpt"></button><button type="button" role="radio" data-type="bar" data-t="barOpt"></button></div>
          </div>
          <div class="field">
            <label for="pc-price"><span class="step" aria-hidden="true">3</span><span data-t="pcPrice"></span></label>
            <input class="input" id="pc-price" inputmode="decimal" autocomplete="off" enterkeyhint="done" aria-describedby="pc-price-err">
            <p class="err" id="pc-price-err" data-t="badShopPrice" hidden></p>
          </div>
          <p class="alt"><button class="link-btn" type="button" id="pc-alt-open" aria-expanded="false" aria-controls="pc-alt" data-t="pcAlt"></button></p>
          <div class="alt-fields" id="pc-alt" hidden>
            <div class="field">
              <label for="cost-rate" data-t="shopRate"></label>
              <input class="input" id="cost-rate" inputmode="decimal" autocomplete="off" enterkeyhint="next" aria-describedby="cost-rate-hint cost-rate-err">
              <p class="hint-text" id="cost-rate-hint" data-t="shopRateHint"></p>
              <p class="err" id="cost-rate-err" data-t="badRate" hidden></p>
            </div>
            <div class="field">
              <label for="cost-making" id="cost-making-label" data-t="making"></label>
              <div class="seg" id="cost-mode" role="radiogroup" aria-labelledby="cost-making-label"><button type="button" role="radio" data-mode="perGram" class="on" data-t="perGramMode"></button><button type="button" role="radio" data-mode="percent" data-t="percentMode"></button></div>
              <input class="input" id="cost-making" inputmode="decimal" autocomplete="off" enterkeyhint="done" aria-describedby="cost-making-err">
              <p class="err" id="cost-making-err" data-t="badMaking" hidden></p>
            </div>
            <p class="hint-text" data-t="pcAltNote"></p>
          </div>
          <div class="pc" id="pc-result" hidden>
            <div class="pc-row pc-main"><span data-t="pcGold"></span><b><span class="num" id="pc-gold"></span> <small id="pc-gold-u"></small></b></div>
            <div id="pc-over">
              <div class="pc-row"><span data-t="pcExtra"></span><b><span class="num" id="pc-extra"></span> <small id="pc-extra-u"></small></b></div>
              <p class="pc-why" id="pc-why"></p>
              <div class="pc-track" aria-hidden="true"><i class="usual" id="pc-usual"></i><i class="dot" id="pc-dot"></i></div>
              <div class="pc-ends" aria-hidden="true"><span data-t="noExtra"></span></div>
              <p class="pc-verdict" id="pc-verdict"></p>
              <p class="pc-range" id="pc-range"></p>
              <p class="pc-why" id="pc-basis"></p>
            </div>
            <p class="pc-verdict" id="pc-under" data-t="pcUnder" hidden></p>
            <hr class="pc-sep">
            <div class="pc-row"><span data-t="pcBack"></span><b><span class="num" id="pc-back"></span> <small id="pc-back-u"></small></b></div>
            <p class="pc-why" id="pc-per100"></p>
            <p class="pc-target" id="pc-target"></p>
          </div>
          <p class="prompt" id="pc-prompt" data-t="pcPrompt"></p>
          <p class="notice" id="pc-noprice" data-t="noPrice" hidden></p>
        </section>

        <section class="calc" id="offer" aria-labelledby="offer-title">
          <p class="eyebrow" data-t="ocWhen"></p>
          <h2 class="sec-title" id="offer-title" data-t="offerTitle"></h2>
          <p class="intro" data-t="ocIntro"></p>
          <button class="try" type="button" id="oc-example" data-t="showExample"></button>
          <div class="field">
            <label for="offer-grams"><span class="step" aria-hidden="true">1</span><span data-t="weightG"></span></label>
            <input class="input" id="offer-grams" inputmode="decimal" autocomplete="off" enterkeyhint="next" aria-describedby="offer-grams-err">
            <p class="err" id="offer-grams-err" data-t="badWeight" hidden></p>
          </div>
          <div class="field">
            <p class="label" id="offer-k-label"><span class="step" aria-hidden="true">2</span><span data-t="karat"></span></p>
            <div class="karats small" id="offer-karats" role="radiogroup" aria-labelledby="offer-k-label"><i class="kline"></i><button type="button" role="radio" data-ok="24">24</button><button type="button" role="radio" data-ok="22">22</button><button type="button" role="radio" data-ok="21">21</button><button type="button" role="radio" data-ok="18">18</button></div>
          </div>
          <div class="field">
            <label for="offer-amount"><span class="step" aria-hidden="true">3</span><span data-t="offerAmount"></span></label>
            <input class="input" id="offer-amount" inputmode="decimal" autocomplete="off" enterkeyhint="done" aria-describedby="offer-amount-err">
            <p class="err" id="offer-amount-err" data-t="badOffer" hidden></p>
          </div>
          <div id="offer-result" hidden>
            <p class="verdict" id="offer-verdict"></p>
            <p class="verdict-sub" id="offer-gap"></p>
            <p class="verdict-sub" id="offer-value"></p>
          </div>
          <p class="prompt" id="offer-prompt" data-t="offerPrompt"></p>
          <p class="notice" id="offer-noprice" data-t="noPrice" hidden></p>
        </section>

        <section class="calc" id="jb" aria-labelledby="jb-title">
          <p class="eyebrow" data-t="jbWhen"></p>
          <h2 class="sec-title" id="jb-title" data-t="jbTitle"></h2>
          <p class="intro" data-t="jbIntro"></p>
          <div class="b3" id="jb-rows"></div>
          <p class="plain-line" data-t="jbDiff"></p>
          <p class="caution" data-t="jbOnlyMoney"></p>
          <p class="note" data-t="jbFine"></p>
        </section>

        <section class="calc">
          <h2 class="sec-title" data-t="placesTitle"></h2>
          <ul class="places" id="places"></ul>
        </section>

        <section class="calc">
          <h2 class="sec-title" data-t="guideTitle"></h2>
          <table class="guide-table"><tbody>
            <tr><th scope="row" data-k-label="24"></th><td class="stamp"><bdi dir="ltr">999 / 999.9</bdi></td><td data-t="g24"></td></tr>
            <tr><th scope="row" data-k-label="22"></th><td class="stamp"><bdi dir="ltr">916</bdi></td><td data-t="g22"></td></tr>
            <tr><th scope="row" data-k-label="21"></th><td class="stamp"><bdi dir="ltr">875</bdi></td><td data-t="g21"></td></tr>
            <tr><th scope="row" data-k-label="18"></th><td class="stamp"><bdi dir="ltr">750</bdi></td><td data-t="g18"></td></tr>
          </tbody></table>
          <p class="note" data-t="stampWhere"></p>
        </section>

        <section class="calc">
          <h2 class="sec-title" data-t="tipsTitle"></h2>
          <ul class="tips"><li data-t="tip1"></li><li data-t="tip2"></li><li data-t="tip3"></li><li data-t="tip4"></li></ul>
        </section>
      </div>
    </section>
  </main>

  <nav class="tabbar" data-aria="tabsLabel">
    <button type="button" data-tab="today" class="on" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span data-t="tabToday"></span></button>
    <button type="button" data-tab="gold"><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="13.2" rx="8.6" ry="5.6"/><ellipse cx="12" cy="12.2" rx="5.6" ry="2.9"/></svg><span data-t="tabGold"></span></button>
    <button type="button" data-tab="future"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 3.5h11M6.5 20.5h11"/><path d="M8 3.5c0 4.6 4 5.6 4 8.5s-4 3.9-4 8.5M16 3.5c0 4.6-4 5.6-4 8.5s4 3.9 4 8.5"/></svg><span data-t="tabFuture"></span></button>
    <button type="button" data-tab="buysell"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9h14l-1.2 10.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8z"/><path d="M9 9V7a3 3 0 0 1 6 0v2"/></svg><span data-t="tabBuySell"></span></button>
  </nav>

  <dialog class="sheet" id="piece-sheet" aria-labelledby="piece-title">
    <form method="dialog" id="piece-form" novalidate>
      <div class="sheet-head"><h2 class="sec-title" id="piece-title"></h2></div>
      <div class="field">
        <label for="piece-grams" data-t="weightG"></label>
        <input class="input" id="piece-grams" name="grams" inputmode="decimal" autocomplete="off" required autofocus aria-describedby="piece-grams-err">
        <p class="err" id="piece-grams-err" data-t="badWeight" hidden></p>
      </div>
      <div class="field">
        <p class="label" id="piece-k-label" data-t="karat"></p>
        <div class="karats small" id="piece-karats" role="radiogroup" aria-labelledby="piece-k-label"><i class="kline"></i><button type="button" role="radio" data-pk="24">24</button><button type="button" role="radio" data-pk="22">22</button><button type="button" role="radio" data-pk="21">21</button><button type="button" role="radio" data-pk="18">18</button></div>
      </div>
      <fieldset class="more">
        <legend data-t="moreDetails"></legend>
        <div class="field">
          <label for="piece-name" data-t="pieceName"></label>
          <input class="input text" id="piece-name" name="name" maxlength="40" autocomplete="off" data-ph="namePlaceholder">
          <div class="chips" id="name-chips"></div>
        </div>
        <div class="field">
          <label for="piece-paid" data-t="boughtPrice"></label>
          <input class="input" id="piece-paid" name="boughtPrice" inputmode="decimal" autocomplete="off" aria-describedby="piece-paid-err">
          <p class="err" id="piece-paid-err" data-t="badPrice" hidden></p>
        </div>
        <div class="field">
          <p class="label" id="piece-when-label" data-t="boughtWhen"></p>
          <div class="when" role="group" aria-labelledby="piece-when-label">
            <select class="input select" id="piece-month" name="month" data-aria="monthLabel"></select>
            <select class="input select" id="piece-year" name="year" data-aria="yearLabel"></select>
          </div>
        </div>
      </fieldset>
      <div class="sheet-actions">
        <button class="btn" type="submit" value="save" data-t="save"></button>
        <button class="btn-quiet" type="button" id="piece-cancel" data-t="cancel"></button>
      </div>
      <div class="remove-row" id="piece-remove-row" hidden>
        <button class="btn-danger" type="button" id="piece-remove" data-t="remove"></button>
        <div class="confirm" id="piece-confirm" role="group" aria-labelledby="piece-confirm-q" hidden>
          <p id="piece-confirm-q" data-t="removeAsk"></p>
          <div class="confirm-actions">
            <button class="btn danger" type="button" id="piece-remove-yes" data-t="removeYes"></button>
            <button class="btn-quiet" type="button" id="piece-remove-no" data-t="removeNo"></button>
          </div>
        </div>
      </div>
    </form>
  </dialog>

  <dialog class="sheet" id="sources-sheet" aria-labelledby="sources-title">
    <div class="sheet-head sticky"><h2 class="sec-title" id="sources-title" data-t="sources"></h2><button class="btn-quiet" type="button" id="sources-close" data-t="close"></button></div>
    <ul class="src-list" id="src-list"></ul>
  </dialog>
</div>
</body>
</html>
