name: Daily close

on:
  schedule:
    - cron: '0 21 * * 1-5' # 21:00 UTC, Monday to Friday (gold's daily close)
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/append-close.mjs
      - name: Commit the new close and redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet app/data/history.json; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data/history.json
          git commit -m "data: daily close $(date -u +%F)"
          git push
          # pushes made with the workflow token do not start other workflows, so start the deploy directly
          gh workflow run pages.yml --ref main
