name: Daily close

on:
  schedule:
    # gold's daily close is read in the hour after 21:00 UTC, Monday to Friday (design D7). GitHub starts busy
    # top-of-the-hour runs late, once by six hours, so try twice off the hour; the script skips late runs.
    - cron: '7 21 * * 1-5'
    - cron: '37 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/append-close.mjs
      - run: node scripts/update-rates.mjs
      - name: Commit the new close and rates, and redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet app/data/history.json app/data/rates.json; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data/history.json app/data/rates.json
          git commit -m "data: daily close and rates $(date -u +%F)"
          # the news and forecast routines also push to main; take their commits first
          git pull --rebase origin main
          git push
          # pushes made with the workflow token do not start other workflows, so start the deploy directly
          gh workflow run pages.yml --ref main
